name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # The browser harnesses on the source and on the published build run as two
  # jobs side by side: one after the other they passed 45 minutes once the
  # redesign's phone-layout checks were added (run 43713295389 was stopped by
  # the time limit with every harness on the source green). The deploy still
  # waits for the whole Tests run (pages.yml), so both must pass. Each job took
  # 38-40 minutes by v128 (run 45088442381), so the limit is 60: a run stopped by
  # the limit is "cancelled", never green, and publishes nothing.
  e2e:
    name: e2e (source)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests on the source (www, split files)
        run: npm run e2e
  e2e-dist:
    name: e2e (dist)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests on the published build (dist, one inlined script)
        run: npm run e2e:dist
