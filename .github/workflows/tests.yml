name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    # The browser harnesses: every screen and role, the ERP upload and month
    # rollover, the audit regressions, the order form — on the source, then on
    # the built site. About 14 minutes each (28 min on 13 Nov, before
    # sync-core.e2e.js added about 1.5 min to each pass), so the limit is 45.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests on the source (www, split files)
        run: npm run e2e
      - name: Browser tests on the published build (dist, one inlined script)
        run: npm run e2e:dist
